<!DOCTYPE html>
<html>
<head>
    <title>Test AJAX</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
    <h1>Test AJAX Update Status</h1>
    <button onclick="testUpdateStatus()">Test Update Status</button>
    <div id="result"></div>

    <script>
    function testUpdateStatus() {
        $.ajaxSetup({
            headers: {
                'X-CSRF-TOKEN': $('meta[name="csrf-token"]').attr('content')
            }
        });

        // Test với order ID 1
        $.post('/webbansach/laravel-app/public/admin/orders/1/update-status', {
            status: 'processing',
            note: 'Test note'
        })
        .done(function(response) {
            console.log('Success:', response);
            $('#result').html('<p style="color: green;">Success: ' + JSON.stringify(response) + '</p>');
        })
        .fail(function(xhr, status, error) {
            console.log('Error:', xhr.responseText);
            $('#result').html('<p style="color: red;">Error: ' + xhr.responseText + '</p>');
        });
    }
    </script>
</body>
</html>
